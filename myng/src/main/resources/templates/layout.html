<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${title} ?: 'My App'">My App</title>

    <!-- CSRF-токен для fetch-запросов (подставляется в заголовок скриптом /js/csrf.js).
         Обращение к токену здесь, в самом начале страницы, заодно гарантирует,
         что он будет создан до начала отправки ответа -->
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <script src="/js/csrf.js"></script>

    <link rel="stylesheet" href="/main.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #f9fafb;
      }

      .editable-active {
        outline: 2px dashed #9333ea;
        padding: 4px;
        border-radius: 6px;
        background-color: #faf5ff;
        cursor: text;
      }
    </style>
  </head>

  <body class="bg-gray-50">
    <div th:replace="~{fragments/header :: header}"></div>

    <main>
      <div th:replace="${content}"></div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
  </body>
</html>
