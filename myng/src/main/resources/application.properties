spring.application.name=MyNG
app.storage.path=../storage
server.port=8080
# spring.profiles.active=pt

# ================= DATABASE =================
spring.config.import=file:./src/main/resources/credentials.properties

spring.datasource.url=jdbc:mysql://localhost:3306/myngdb?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================= JPA / HIBERNATE =================
spring.jpa.hibernate.ddl-auto=validate

# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true 

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ================= GAME FILES =================
# Game files are served from a separate origin (another port) so that game JS
# is isolated from the site by the browser's same-origin policy
app.games.port=8082
app.games.base-url=http://127.0.0.1:${app.games.port}
# Site pages allowed to embed games in an iframe (CSP frame-ancestors), space-separated
app.site.origins=http://localhost:${server.port} http://127.0.0.1:${server.port}
# Limits for downloading a game from GitHub (zip bomb protection), in bytes
app.games.max-archive-size=104857600
app.games.max-unpacked-size=209715200
app.games.max-entries=5000

# ================= SESSION =================
# The browser does not send the session cookie with requests initiated by other sites
server.servlet.session.cookie.same-site=lax
